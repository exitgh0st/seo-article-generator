<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" routerLink="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <strong>{{ site.name }}</strong>
        <small>{{ site.tagline }}</small>
      </span>
    </a>

    <nav class="nav" aria-label="Categories">
      @for (c of categories; track c) {
        <a [routerLink]="['/category', c]" routerLinkActive="active">{{ labels[c] }}</a>
      }
    </nav>

    <a class="admin-link" routerLink="/admin" routerLinkActive="active">Admin</a>
  </div>
</header>

<main id="main">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>&copy; {{ year }} {{ site.name }}. Reporting sourced to primary advisories.</p>
    <p class="footer-links">
      <a [href]="feedBase + '/rss.xml'">RSS</a>
      <a [href]="feedBase + '/sitemap.xml'">Sitemap</a>
    </p>
  </div>
</footer>
