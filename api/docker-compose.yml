services:
  postgres:
    image: postgres:17-alpine
    container_name: seo-article-generator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: seo
      POSTGRES_DB: seo_articles
    ports:
      - '5433:5432'
    volumes:
      - seo-article-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seo -d seo_articles']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  seo-article-pgdata:
